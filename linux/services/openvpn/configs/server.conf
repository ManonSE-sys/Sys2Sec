# Exemple de configuration serveur OpenVPN
# Les chemins, routes et paramètres doivent être adaptés à l'environnement.

port 1194
proto udp
dev tun

ca /etc/openvpn/easy-rsa/pki/ca.crt
cert /etc/openvpn/easy-rsa/pki/issued/srv-vpn.crt
key /etc/openvpn/easy-rsa/pki/private/srv-vpn.key
dh /etc/openvpn/easy-rsa/pki/dh.pem

topology subnet
server 10.8.0.0 255.255.255.0

ifconfig-pool-persist /var/log/openvpn/ipp.txt

push "route 192.168.1.0 255.255.255.0"

keepalive 10 120

persist-key
persist-tun

status /var/log/openvpn/openvpn-status.log

verb 3
explicit-exit-notify 1

# Pour une nouvelle configuration, privilégier les mécanismes
# de négociation modernes compatibles avec les versions déployées.
# Exemple :
# data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305

# Protection supplémentaire possible du canal TLS :
# tls-crypt /etc/openvpn/ta.key
