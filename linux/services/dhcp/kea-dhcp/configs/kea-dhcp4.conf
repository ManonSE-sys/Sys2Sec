 {
  		"Dhcp4": {
  			"interfaces-config": {
  				"interfaces": ["enp0s3" ]
  			},

  			"control-socket": {
  				"socket-type": "unix",
  				"socket-name": "/run/kea/kea4-ctrl-socket"
  			},

  			"lease-database": {
  				"type": "memfile",
  				"lfc-interval": 3600
  			},

  			"expired-leases-processing": {
  				"reclaim-timer-wait-time": 10,
  				"flush-reclaimed-timer-wait-time": 25,
  				"hold-reclaimed-time": 3600,
  				"max-reclaim-leases": 100,
  				"max-reclaim-time": 250,
  				"unwarned-reclaim-cycles": 5
  			},

  			"renew-timer": 900,
  			"rebind-timer": 1800,
  			"valid-lifetime": 3600,

  			"client-classes": [
  				{
  					"name": "EFI clients",
  					"test": "option[93].hex == 0x0007 or option[93].hex == 0x0009",
  					"boot-file-name": "efi64/syslinux.efi"

  				},
  				{
  					"name": "BIOS clients",
  					"test": "not member('EFI clients')",
  					"boot-file-name": "bios/pxelinux.0"

  				}
  			],

  			"subnet4": [
  				{
  					"id": 1,
  					"subnet": "192.168.1.0/24",
  					"pools": [ { "pool": "192.168.1.200 - 192.168.1.205" } ],
  					"next-server": "192.168.1.181",
  					"require-client-classes": [
  						"EFI clients",
  						"BIOS clients"]

  						}
  					],

  			"loggers": [
  			{
  				"name": "kea-dhcp4",
  				"output_options": [
  					{
  						"output": "stdout",

  						"pattern": "%-5p %m\n",

  					}
  				],
  				"severity": "INFO",
  				"debuglevel": 0
  			}
  		  ]
  		}
