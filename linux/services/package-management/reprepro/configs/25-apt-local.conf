<VirtualHost *:80>
   ServerName srv-apt

   DocumentRoot "/var/www/"
   Alias /ubuntu/ "/var/www/repos/ubuntu/"
   Alias /debian/ "/var/www/repos/ubuntu/"

   <Directory "/var/www/repos/">
       AllowOverride None
       Require all granted
   </Directory>

   ErrorLog "/var/log/apache2/srv-apt_error.log"
   CustomLog "/var/log/apache2/srv-apt_access.log" combined

   ServerAlias srv-apt
</VirtualHost>
