---
- name: Linux security hardening
  hosts: linux
  become: true

  tasks:
    - name: Deploy SSH hardening configuration
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        owner: root
        group: root
        mode: '0644'
        content: "PermitRootLogin no\nPasswordAuthentication no\nPubkeyAuthentication yes\n"
      notify: Restart SSH

    - name: Set permissions on /etc/passwd
      ansible.builtin.file:
        path: /etc/passwd
        owner: root
        group: root
        mode : '0644'

    - name: Set permissions on /etc/shadow
      ansible.builtin.file:
        path: /etc/shadow
        owner: root
        group: shadow
        mode: '0640'

    - name: Set permissions on /etc/sudoers
      ansible.builtin.file:
        path: /etc/sudoers
        owner: root
        group: root
        mode: '0440'

    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true
    
    - name: Set default incoming policy to deny
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set default outgoing policy to allow
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: safe

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
